<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153f3b">
  <meta name="description" content="EVSync browser-based Nurse and EVS prototype.">
  <title>EVSync v0.9</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23153f3b'/%3E%3Cpath d='M10 13h14v6H10zm6 9h14v6H16z' fill='%23b9e0bc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./domain.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="prototype" aria-label="EVSync app prototype">
    <section class="phone" id="phone" aria-label="Nurse and EVS app">
      <div class="phone-status" aria-hidden="true">
        <span id="phone-time"></span><span class="camera"></span>
        <svg width="55" height="13" viewBox="0 0 55 13" fill="none"><path d="M1 10V8M5 10V6M9 10V4M13 10V2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4.5c3-3 7-3 10 0M22.5 7c1.5-1.5 3.5-1.5 5 0M25 10h.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="36" y="2" width="15" height="9" rx="2" stroke="currentColor"/><rect x="38" y="4" width="11" height="5" rx=".7" fill="currentColor"/><path d="M53 5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="phone-app" id="phone-app"><p class="loading">Loading rooms…</p></div>
      <div class="demo-menu-footer"><button class="full" data-action="main-menu">Demo mode: main menu</button></div>
      <div class="phone-safe-area" aria-hidden="true"><span></span></div>
    </section>
    <footer class="prototype-caption">EVSync · Prototype v0.9</footer>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
